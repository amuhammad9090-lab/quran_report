name: quran_report
description: Laporan Capaian Hafalan & Tahsin Al-Qur'an
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Edit Avatar
  image_picker: ^1.1.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Notification
  flutter_local_notifications: ^18.0.0

  # IDs & formatting
  uuid: ^4.4.0
  intl: ^0.20.2

  # Export
  pdf: ^3.11.0
  printing: ^5.13.1
  excel: ^4.0.3
  archive: ^3.6.1
  share_plus: ^11.0.0
  open_filex: ^4.5.0
  media_store_plus: ^0.1.3

  # UI
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/quran_line_dataset_unified_ayats_schema.json
    - assets/images/app_icon.png
    - assets/images/logo_smpit.png